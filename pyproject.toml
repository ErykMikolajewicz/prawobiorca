[project]
name = "prawobiorca"
version = "0.1.0"
description = "Law acts search engine with AI features."
license = "MIT"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "ruff==0.17.*",
    "zensical==0.1.*",
    "google-auth[requests]==2.62.*",
    "zizmor==1.32.*",
    "actionlint-py==1.7.12.*",
    "ty==0.0.100",
    "hadolint-py==2.15.1.*",
    "complexipy==8.3.*",
]

[dependency-groups]
deployment = [
    "checkov==3.4.*",
]

[tool.uv]
override-dependencies = ["asteval>=1.0.9"]

[tool.ruff]
extend = "ruff.toml"

[tool.complexipy]
max-complexity-allowed = 15
exclude = ["apps/core/alembic/**"]

[tool.ty.src]
include = ["scripts"]

[tool.ty.environment]
root = ["scripts/local"]
