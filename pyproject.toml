[project]
name = "prawobiorca"
version = "0.1.0"
description = "Law acts search engine with AI features."
license = "MIT"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "ruff==0.17.*",
    "mkdocstrings[python]==1.0.*",
    "zensical==0.0.74",
    "google-auth[requests]==2.62.*",
    "zizmor==1.32.*",
    "actionlint-py==1.7.12.*",
    "ty==0.0.99",
    "hadolint-py==2.15.1.*",
]

[dependency-groups]
deployment = [
    "checkov==3.4.*",
]

[tool.ruff]
extend = "ruff.toml"

[tool.ty.src]
include = ["scripts"]

[tool.ty.environment]
root = ["scripts/local"]
