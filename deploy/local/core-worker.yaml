apiVersion: v1
kind: Pod
metadata:
  name: core-worker
  labels:
    app: prawobiorca
    component: core-worker
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: core-worker
      image: localhost/prawobiorca/core:latest
      command: ["taskiq", "worker", "core_service.framework.workers.main:broker", "core_service.framework.workers.regulations", "core_service.framework.workers.applications"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      envFrom:
        - configMapRef:
            name: core-config
      env:
        - name: APP_JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: JWT_SECRET_KEY
        - name: RELATIONAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: POSTGRES_PASSWORD
        - name: OBJECT_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: OBJECT_STORAGE_ACCESS_KEY
        - name: OBJECT_STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: OBJECT_STORAGE_SECRET_KEY
