apiVersion: v1
kind: Pod
metadata:
  name: prawobiorca-migrations
  labels:
    app: prawobiorca
    component: prawobiorca-migrations
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: prawobiorca-migrations
      image: localhost/prawobiorca-backend:latest
      command: ["alembic", "upgrade", "head"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      envFrom:
        - configMapRef:
            name: prawobiorca-backend-config
      env:
        - name: RELATIONAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: POSTGRES_PASSWORD
