apiVersion: v1
kind: Pod
metadata:
  name: llm
  labels:
    app: prawobiorca
    component: llm
spec:
  containers:
    - name: llm
      image: docker.io/openvino/model_server:2026.4.0-gpu
      args:
        - --source_model=OpenVINO/Qwen3.6-35B-A3B-int4-ov
        - --model_name=qwen-3.6-35b
        - --model_repository_path=/models
        - --task=text_generation
        - --target_device=AUTO
        - --rest_port=8080
      securityContext:
        privileged: true
      ports:
        - containerPort: 8080
          hostPort: 8083
      volumeMounts:
        - name: llm-model
          mountPath: /models
        - name: dri
          mountPath: /dev/dri
  volumes:
    - name: llm-model
      persistentVolumeClaim:
        claimName: llm-model
    - name: dri
      hostPath:
        path: /dev/dri
