apiVersion: v1
kind: Pod
metadata:
  name: prawobiorca-backend
  labels:
    app: prawobiorca
    component: prawobiorca-backend
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: prawobiorca-backend
      image: localhost/prawobiorca-backend:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 8000
      envFrom:
        - configMapRef:
            name: prawobiorca-backend-config
      env:
        - name: APP_JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: JWT_SECRET_KEY
        - name: RELATIONAL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: POSTGRES_PASSWORD
        - name: OBJECT_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: OBJECT_STORAGE_ACCESS_KEY
        - name: OBJECT_STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: OBJECT_STORAGE_SECRET_KEY
