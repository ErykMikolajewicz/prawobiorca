apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: prawobiorca
    component: postgres
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgres
      image: docker.io/pgvector/pgvector:0.8.4-pg18-trixie
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 5432
          hostPort: 5432
      startupProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        periodSeconds: 10
        failureThreshold: 60
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        periodSeconds: 10
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres"]
        periodSeconds: 20
        failureThreshold: 6
      volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql
        - name: pg-run
          mountPath: /run/postgresql
      env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: prawobiorca-secrets
              key: POSTGRES_PASSWORD
  volumes:
    - name: pg-data
      persistentVolumeClaim:
        claimName: pg-data
    - name: pg-run
      emptyDir: {}
