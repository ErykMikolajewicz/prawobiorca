apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - rbac.yaml
  - secrets.yaml
  - ingress.yaml

patches:
  - path: patches/secrets-store-csi.yaml
    target:
      kind: Deployment|Job
      name: core|core-worker|core-migrations|postgres
  - path: patches/spot.yaml
    target:
      kind: Deployment
      name: core|core-worker|web
  - path: patches/gke-backend.yaml
    target:
      kind: Service
      name: core|web
  - path: patches/worker-embedding-batch.yaml

configMapGenerator:
  - name: core-config
    behavior: merge
    envs:
      - config.env
