apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-store-csi
spec:
  template:
    spec:
      serviceAccountName: prawobiorca-runner
      volumes:
        - name: secrets-store
          secret: null
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: prawobiorca-secrets
