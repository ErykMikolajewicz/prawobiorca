apiVersion: v1
kind: PersistentVolume
metadata:
  name: pg-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: default
    name: pg-data
  hostPath:
    path: /var/lib/dev-volumes/pg-data
    type: Directory

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rustfs-data
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: default
    name: rustfs-data
  hostPath:
    path: /var/lib/dev-volumes/rustfs-data
    type: Directory
