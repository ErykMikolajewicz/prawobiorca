apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prawobiorca
      component: extraction
  template:
    metadata:
      labels:
        app: prawobiorca
        component: extraction
    spec:
      containers:
        - name: extraction
          image: prawobiorca/extraction
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: extraction
spec:
  selector:
    app: prawobiorca
    component: extraction
  ports:
    - port: 8080
      targetPort: 8080
