apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prawobiorca
      component: embedding
  template:
    metadata:
      labels:
        app: prawobiorca
        component: embedding
    spec:
      containers:
        - name: embedding
          image: prawobiorca/embedding
          args:
            - --model_path=/models/mmlw-retrieval-roberta-large-v2
            - --model_name=mmlw-retrieval-roberta-large-v2
            - --task=embeddings
            - --pooling=CLS
            - --target_device=CPU
            - --rest_port=8080
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8080
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: embedding
spec:
  selector:
    app: prawobiorca
    component: embedding
  ports:
    - port: 8080
      targetPort: 8080
