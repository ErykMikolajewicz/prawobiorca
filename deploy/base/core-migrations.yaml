apiVersion: batch/v1
kind: Job
metadata:
  name: core-migrations
  labels:
    deploy-phase: migrations
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: prawobiorca
        component: core-migrations
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core-migrations
          image: prawobiorca/core
          command: ["alembic", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          envFrom:
            - configMapRef:
                name: core-config
      volumes:
        - name: secrets-store
          secret:
            secretName: prawobiorca-secrets
