apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prawobiorca
      component: core
  template:
    metadata:
      labels:
        app: prawobiorca
        component: core
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      serviceAccountName: prawobiorca-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: europe-central2-docker.pkg.dev/prawobiorca/prawobiorca-repo/core:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          envFrom:
            - configMapRef:
                name: core-config
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: prawobiorca-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: core
  annotations:
    cloud.google.com/backend-config: '{"default": "prawobiorca-backend-config"}'
spec:
  type: NodePort
  selector:
    app: prawobiorca
    component: core
  ports:
    - port: 8000
      targetPort: 8000
