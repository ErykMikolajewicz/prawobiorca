[env]
VIRTUAL_ENV = ""

[tasks]
dev = { cmd = "uv run ../scripts/local/dev.py", cwd = "core-service" }
run_locally = "uv run scripts/local/run.py"
run_locally_down = "uv run scripts/local/stop.py"
run_e2e_env = "uv run scripts/local/run_e2e.py"

test = { cmd = "uv run pytest tests/unit", cwd = "core-service" }
test_integration = { cmd = "uv run pytest tests/integration", cwd = "core-service" }
test_extraction = { cmd = "uv run --group test pytest tests/integration", cwd = "extraction-service" }

build_app = "podman image build --tag=prawobiorca-backend core-service"
build_extraction-service = "podman image build --tag=extraction-service extraction-service"
build_embedding-service = "podman image build --tag=embedding-service embedding-service"
build_frontend = "podman image build --tag=prawobiorca-frontend prawobiorca-frontend"

upgrade_db = { cmd = "uv run alembic upgrade head", cwd = "core-service" }
seed = { cmd = "uv run scripts/seed_relational_db.py", cwd = "core-service" }
init_regulations = { cmd = "uv run scripts/init_regulations.py", cwd = "core-service" }
init_e2e_regulation = { cmd = "uv run scripts/init_e2e_regulation.py", cwd = "core-service" }
export_openapi = { cmd = "uv run scripts/export_openapi.py", cwd = "core-service" }
generate_api_types = { cmd = "pnpm generate:api-types", cwd = "prawobiorca-frontend" }
generate_api_client = { cmd = "pnpm generate:api-client", cwd = "prawobiorca-frontend" }

[tasks.cov]
cwd = "core-service"
sequence = [
    { cmd = "uv run coverage erase" },
    { cmd = "uv run pytest tests/unit --cov=src --cov-config=coverage.toml" },
    { cmd = "uv run coverage report -m --skip-covered --fail-under=90 --sort=Cover --rcfile=coverage.toml" }
]

[tasks.build_images]
sequence = ["build_app", "build_extraction-service", "build_embedding-service", "build_frontend"]

[tasks.api_types]
sequence = ["export_openapi", "generate_api_types", "generate_api_client"]

[tasks.init_db]
sequence = ["upgrade_db", "seed", "init_regulations"]
