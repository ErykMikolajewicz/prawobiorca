[project]
name = "core-service"
version = "0.1.0"
description = "Law acts search engine with AI features."
license = "MIT"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "aiobotocore==3.10.*",
    "alembic==1.20.*",
    "asyncpg==0.32.*",
    "bcrypt==5.0.*",
    "email-validator==2.3.*",
    "fastapi==0.162.*",
    "google-auth[requests]==2.62.*",
    "granian==2.8.*",
    "httpx2==2.16.*",
    "pgvector==0.5.*",
    "pydantic==2.14.*",
    "openai==3.39.*",
    "pydantic-settings==2.16.*",
    "pyjwt==2.15.*",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.*",
    "jinja2==3.1.*",
    "docxtpl==0.20.*",
    "taskiq==0.13.*",
    "tokenizers==0.23.*",
]

[dependency-groups]
dev = [
    "granian[reload]==2.8.*",
    "taskiq[reload]==0.13.*",
]

test = [
    "pytest==9.1.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.1.*",
    "testcontainers[postgres]==4.15.*",
]

[tool.uv]
default-groups = ["dev", "test"]
