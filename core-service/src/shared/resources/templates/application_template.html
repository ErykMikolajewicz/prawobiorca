<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Wniosek</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;

            @bottom-center {
                content: counter(page) " z " counter(pages);
                font-size: 10pt;
                color: gray;
            }
        }

        body {
            font-family: 'DejaVu Sans', 'DejaVu Serif', sans-serif;
            font-size: 12pt;
            line-height: 1.5;
            color: black;
            text-align: justify;
        }

        .header-date {
            text-align: right;
            margin-bottom: 40px;
        }

        .applicant-info {
            width: 50%;
            margin-bottom: 40px;
        }

        .recipient-info {
            text-align: right;
            margin-left: 50%;
            margin-bottom: 50px;
            white-space: pre-wrap;
        }

        .document-title {
            text-align: center;
            font-size: 14pt;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .content {
            margin-bottom: 60px;
            white-space: pre-wrap;
        }

        .signature-block {
            break-inside: avoid;
            margin-top: 50px;
            text-align: right;
            width: 40%;
            margin-left: 60%;
        }

        .signature-line {
            border-bottom: 1px dotted black;
            margin-bottom: 5px;
            height: 20px;
        }

        .signature-label {
            text-align: center;
            font-size: 10pt;
        }
    </style>
</head>

<body>
    <div class="header-date">
        Wrocław, {{ current_date }} r.
    </div>

    <div class="applicant-info">
        <strong>{{ student.user_name }}</strong><br>
        Nr albumu: {{ student.student_id }}<br>
        {{ student.title }}<br>
        {{ student.department }}<br>
        Semestr: {{ student.semester }}
    </div>

    <div class="recipient-info">
        {{ recipient_info }}
    </div>

    <div class="document-title">
        {{ title | upper }}
    </div>

    <div class="content">
        {{ content }}
    </div>

    <div class="signature-block">
        <div class="signature-line"></div>
        <div class="signature-label">(podpis)</div>
    </div>
</body>

</html>
