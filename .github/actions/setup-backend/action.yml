name: Setup backend
description: Install just and uv, sync Python dependencies and prepare the backend environment file
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: 1.58.0
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - run: uv sync --locked
      shell: bash
    - run: cp core-service/.env.example core-service/.env
      shell: bash
