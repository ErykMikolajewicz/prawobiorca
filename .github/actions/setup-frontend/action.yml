name: Setup frontend
description: Install just, pnpm and Node.js and install frontend dependencies
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: 1.58.0
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: prawobiorca-frontend/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: prawobiorca-frontend/package.json
        cache: pnpm
        cache-dependency-path: prawobiorca-frontend/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: prawobiorca-frontend
