name: DAST

on:
  schedule:
    - cron: "0 4 * * 6"
      timezone: Europe/Warsaw
  workflow_dispatch:

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

env:
  EMBEDDING_IMAGE: ghcr.io/erykmikolajewicz/prawobiorca/embedding@sha256:a5cc0d0c432e7f6ecbc2568d8fe558c410f8780428a2bf121d4a7fa3589dd16c

jobs:
  api:
    if: github.repository_id == '1120768327'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/core
          file: apps/core/Containerfile
          load: true
          tags: localhost/prawobiorca/core:e2e
          cache-from: type=gha,scope=dast-core
          cache-to: type=gha,scope=dast-core,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          file: apps/web/Containerfile
          load: true
          tags: localhost/prawobiorca/web:e2e
          cache-from: type=gha,scope=dast-web
          cache-to: type=gha,scope=dast-web,mode=max
      - run: |
          mkdir -p .llm-models
          kind create cluster --name prawobiorca-e2e --config deploy/kind/cluster.yaml
          kind load docker-image --name prawobiorca-e2e localhost/prawobiorca/core:e2e localhost/prawobiorca/web:e2e
      - name: Start disposable application
        id: environment
        run: >
          just deploy e2e
          --image core=localhost/prawobiorca/core:e2e
          --image web=localhost/prawobiorca/web:e2e
          --image "embedding=$EMBEDDING_IMAGE"
      - name: Scan API as guest and authenticated user
        shell: bash
        run: |
          mkdir -p .cache/dast
          just dast 2>&1 | tee .cache/dast/scan.log
      - name: Collect application logs
        if: ${{ !cancelled() && steps.environment.outcome != 'skipped' }}
        run: |
          mkdir -p .cache/dast/report
          if [ -f .cache/dast/scan.log ]; then
            cp .cache/dast/scan.log .cache/dast/report/scan.log
          fi
          kubectl --context kind-prawobiorca-e2e logs deployment/core > .cache/dast/report/core.log 2>&1 || true
          kubectl --context kind-prawobiorca-e2e logs deployment/gateway > .cache/dast/report/gateway.log 2>&1 || true
      - name: Upload private DAST reports
        if: ${{ !cancelled() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/dast/report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Stop application
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        run: kind delete cluster --name prawobiorca-e2e
