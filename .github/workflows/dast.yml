name: DAST

on:
  schedule:
    - cron: "0 4 * * 6"
      timezone: Europe/Warsaw
  workflow_dispatch:

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    if: github.repository_id == '1120768327'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - run: |
          podman pull ghcr.io/erykmikolajewicz/prawobiorca/embedding:latest
          podman tag ghcr.io/erykmikolajewicz/prawobiorca/embedding:latest localhost/prawobiorca/embedding:latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/core
          file: apps/core/Containerfile
          load: true
          tags: localhost/prawobiorca/core:latest
          cache-from: type=gha,scope=dast-core
          cache-to: type=gha,scope=dast-core,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          file: apps/web/Containerfile
          load: true
          tags: localhost/prawobiorca/web:latest
          cache-from: type=gha,scope=dast-web
          cache-to: type=gha,scope=dast-web,mode=max
      - run: docker save localhost/prawobiorca/core:latest localhost/prawobiorca/web:latest | podman load
      - name: Start disposable application
        id: environment
        run: just run-e2e-env
      - name: Scan API as guest and authenticated user
        shell: bash
        run: |
          mkdir -p .cache/dast
          just dast 2>&1 | tee .cache/dast/scan.log
      - name: Collect application logs
        if: ${{ !cancelled() && steps.environment.outcome != 'skipped' }}
        run: |
          mkdir -p .cache/dast/report
          if [ -f .cache/dast/scan.log ]; then
            cp .cache/dast/scan.log .cache/dast/report/scan.log
          fi
          podman logs core-core > .cache/dast/report/core.log 2>&1 || true
          podman logs nginx-nginx > .cache/dast/report/nginx.log 2>&1 || true
      - name: Upload private DAST reports
        if: ${{ !cancelled() && steps.environment.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/dast/report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Stop application
        if: ${{ always() && steps.environment.outcome != 'skipped' }}
        run: just run-locally-down
