name: Mirror

on:
  push:
    branches: [main]

concurrency:
  group: mirror

jobs:
  mirror:
    if: github.repository_id == '1120768327'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git push "https://x-access-token:${MIRROR_TOKEN}@github.com/ErykMikolajewicz/prawobiorca.git" "HEAD:refs/heads/main"
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
