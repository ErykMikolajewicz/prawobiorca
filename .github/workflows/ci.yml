name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check
      - run: cp core-service/.env.example core-service/.env
      - run: uv run poe cov

  integration:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: cp core-service/.env.example core-service/.env
      - run: uv run poe test_integration

  frontend:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prawobiorca-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: prawobiorca-frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: prawobiorca-frontend/package.json
          cache: pnpm
          cache-dependency-path: prawobiorca-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm test:unit --run

  api-types:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: cp core-service/.env.example core-service/.env
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: prawobiorca-frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: prawobiorca-frontend/package.json
          cache: pnpm
          cache-dependency-path: prawobiorca-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: prawobiorca-frontend
      - run: uv run poe api_types
      - run: git diff --exit-code core-service/openapi.json prawobiorca-frontend/src/types/api/schema.ts prawobiorca-frontend/src/api/generated

  e2e:
    if: github.repository == 'ErykMikolajewicz/prawobiorca-backend' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: cp core-service/.env.example core-service/.env
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: prawobiorca-frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: prawobiorca-frontend/package.json
          cache: pnpm
          cache-dependency-path: prawobiorca-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: prawobiorca-frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: prawobiorca-frontend
      - run: |
          podman pull ghcr.io/erykmikolajewicz/embedding-service:latest
          podman tag ghcr.io/erykmikolajewicz/embedding-service:latest localhost/embedding-service:latest
      - run: uv run poe build_app
      - run: uv run poe build_frontend
      - run: uv run poe run_e2e_env
      - run: pnpm test:e2e
        working-directory: prawobiorca-frontend
      - if: failure()
        run: |
          podman logs prawobiorca-backend-prawobiorca-backend
          podman logs nginx-nginx
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: prawobiorca-frontend/playwright-report/
