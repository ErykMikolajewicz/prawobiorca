name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    if: github.repository_id == '1120768327'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - '**/*.py'
              - pyproject.toml
              - uv.lock
              - ruff.toml
              - .github/workflows/ci.yml
            backend:
              - core-service/**
              - pyproject.toml
              - uv.lock
              - justfile
              - .github/workflows/ci.yml
            frontend:
              - prawobiorca-frontend/**
              - justfile
              - .github/workflows/ci.yml

  backend:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: just check-backend

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: just test-integration

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: just check-frontend

  api-types:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: just api-types
      - run: git diff --exit-code core-service/openapi.json prawobiorca-frontend/src/api/generated
