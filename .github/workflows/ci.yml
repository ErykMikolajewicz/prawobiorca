name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  changes:
    if: github.repository_id == '989302666'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - '**/*.py'
              - pyproject.toml
              - uv.lock
              - ruff.toml
              - .github/workflows/ci.yml
            backend:
              - core-service/**
              - pyproject.toml
              - uv.lock
              - poe.toml
              - .github/workflows/ci.yml
            frontend:
              - prawobiorca-frontend/**
              - .github/workflows/ci.yml
            e2e:
              - scripts/local/**
              - deploy/local/**

  backend:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: uv run ruff check .
      - run: uv run ruff format --check
      - run: uv run poe cov

  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: uv run poe test_integration

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prawobiorca-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: pnpm check
      - run: pnpm type-check
      - run: pnpm test:unit --run

  api-types:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - run: uv run poe api_types
      - run: git diff --exit-code core-service/openapi.json prawobiorca-frontend/src/api/generated

  e2e:
    needs: changes
    if: >
      github.base_ref == 'main' && (
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
        working-directory: prawobiorca-frontend
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: prawobiorca-frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: prawobiorca-frontend
      - run: |
          podman pull ghcr.io/erykmikolajewicz/embedding-service:latest
          podman tag ghcr.io/erykmikolajewicz/embedding-service:latest localhost/embedding-service:latest
      - run: uv run poe build_app
      - run: uv run poe build_frontend
      - run: uv run poe run_e2e_env
      - run: pnpm test:e2e
        working-directory: prawobiorca-frontend
      - if: failure()
        run: |
          podman logs prawobiorca-backend-prawobiorca-backend
          podman logs nginx-nginx
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: prawobiorca-frontend/playwright-report/
