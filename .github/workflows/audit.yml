name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "**/uv.lock"
      - "**/pyproject.toml"
      - prawobiorca-frontend/package.json
      - prawobiorca-frontend/pnpm-lock.yaml
      - justfile
      - .github/workflows/audit.yml

jobs:
  backend:
    if: github.repository_id == '1120768327'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - run: just audit-backend

  frontend:
    if: github.repository_id == '1120768327'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - run: just audit-frontend
