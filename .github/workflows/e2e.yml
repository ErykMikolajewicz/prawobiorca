name: E2E

on:
  push:
    branches: [main]
  workflow_call:

jobs:
  e2e:
    if: github.repository_id == '989302666'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
        working-directory: prawobiorca-frontend
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: prawobiorca-frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: prawobiorca-frontend
      - run: |
          podman pull ghcr.io/erykmikolajewicz/embedding-service:latest
          podman tag ghcr.io/erykmikolajewicz/embedding-service:latest localhost/embedding-service:latest
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: core-service
          file: core-service/Containerfile
          load: true
          tags: localhost/prawobiorca-backend:latest
          cache-from: type=gha,scope=prawobiorca-backend
          cache-to: type=gha,scope=prawobiorca-backend,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: prawobiorca-frontend
          file: prawobiorca-frontend/Containerfile
          load: true
          tags: localhost/prawobiorca-frontend:latest
          cache-from: type=gha,scope=prawobiorca-frontend
          cache-to: type=gha,scope=prawobiorca-frontend,mode=max
      - run: docker save localhost/prawobiorca-backend:latest localhost/prawobiorca-frontend:latest | podman load
      - run: just run-e2e-env
      - run: pnpm test:e2e
        working-directory: prawobiorca-frontend
      - if: failure()
        run: |
          podman logs prawobiorca-backend-prawobiorca-backend
          podman logs nginx-nginx
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: prawobiorca-frontend/playwright-report/
