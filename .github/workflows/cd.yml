name: CD

on:
  release:
    types: [released]

env:
  REGISTRY: europe-central2-docker.pkg.dev
  REPOSITORY: europe-central2-docker.pkg.dev/prawobiorca/prawobiorca-repo

jobs:
  e2e:
    if: github.repository_id == '989302666'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  deploy:
    if: github.repository_id == '989302666'
    needs: e2e
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/296630821006/locations/global/workloadIdentityPools/github/providers/prawobiorca-backend
          service_account: prawobiorca-deployer@prawobiorca.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/core
          file: apps/core/Containerfile
          push: true
          tags: |
            ${{ env.REPOSITORY }}/core:${{ github.sha }}
            ${{ env.REPOSITORY }}/core:latest
          cache-from: type=gha,scope=core
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          file: apps/web/Containerfile
          push: true
          tags: |
            ${{ env.REPOSITORY }}/web:${{ github.sha }}
            ${{ env.REPOSITORY }}/web:latest
          cache-from: type=gha,scope=web
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: prawobiorca
          location: europe-central2
      - run: >
          sed -i "s|:latest|:${{ github.sha }}|"
          deploy/gcp/core-migrations.yaml
          deploy/gcp/core.yaml
          deploy/gcp/core-worker.yaml
          deploy/gcp/web.yaml
      - run: |
          kubectl delete job core-migrations --ignore-not-found
          kubectl apply -f deploy/gcp/core-migrations.yaml
          kubectl wait --for=condition=complete job/core-migrations --timeout=300s
      - run: |
          kubectl apply -f deploy/gcp/core.yaml
          kubectl rollout status deployment/core --timeout=180s
      - run: |
          kubectl apply -f deploy/gcp/core-worker.yaml
          kubectl rollout status deployment/core-worker --timeout=180s
      - run: |
          kubectl apply -f deploy/gcp/web.yaml
          kubectl rollout status deployment/web --timeout=180s
