name: CD

on:
  release:
    types: [released]

env:
  REGISTRY: europe-central2-docker.pkg.dev
  REPOSITORY: europe-central2-docker.pkg.dev/prawobiorca/prawobiorca-repo

jobs:
  e2e:
    if: github.repository_id == '989302666'
    uses: ./.github/workflows/e2e.yml

  deploy:
    if: github.repository_id == '989302666'
    needs: e2e
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/296630821006/locations/global/workloadIdentityPools/github/providers/prawobiorca-backend
          service_account: prawobiorca-deployer@prawobiorca.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: core-service
          file: core-service/Containerfile
          push: true
          tags: |
            ${{ env.REPOSITORY }}/prawobiorca-backend:${{ github.sha }}
            ${{ env.REPOSITORY }}/prawobiorca-backend:latest
          cache-from: type=gha,scope=prawobiorca-backend
      - uses: docker/build-push-action@v7
        with:
          context: prawobiorca-frontend
          file: prawobiorca-frontend/Containerfile
          push: true
          tags: |
            ${{ env.REPOSITORY }}/prawobiorca-frontend:${{ github.sha }}
            ${{ env.REPOSITORY }}/prawobiorca-frontend:latest
          cache-from: type=gha,scope=prawobiorca-frontend
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: prawobiorca
          location: europe-central2
      - run: >
          sed -i "s|:latest|:${{ github.sha }}|"
          deploy/gcp/prawobiorca-migrations.yaml
          deploy/gcp/prawobiorca-backend.yaml
          deploy/gcp/prawobiorca-worker.yaml
          deploy/gcp/prawobiorca-frontend.yaml
      - run: |
          kubectl delete job prawobiorca-migrations --ignore-not-found
          kubectl apply -f deploy/gcp/prawobiorca-migrations.yaml
          kubectl wait --for=condition=complete job/prawobiorca-migrations --timeout=300s
      - run: |
          kubectl apply -f deploy/gcp/prawobiorca-backend.yaml
          kubectl rollout status deployment/prawobiorca-backend --timeout=180s
      - run: |
          kubectl apply -f deploy/gcp/prawobiorca-worker.yaml
          kubectl rollout status deployment/prawobiorca-worker --timeout=180s
      - run: |
          kubectl apply -f deploy/gcp/prawobiorca-frontend.yaml
          kubectl rollout status deployment/prawobiorca-frontend --timeout=180s
