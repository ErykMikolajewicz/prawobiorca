[project]
name = "core-service"
version = "0.1.0"
description = "Law acts search engine with AI features."
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "aiobotocore==3.10.*",
    "alembic==1.20.*",
    "asyncpg==0.32.*",
    "bcrypt==5.0.*",
    "email-validator==2.3.*",
    "fastapi==0.162.*",
    "google-auth[requests]==2.62.*",
    "granian==2.8.*",
    "httpx2==2.16.*",
    "pgvector==0.5.*",
    "pydantic==2.14.*",
    "openai==3.42.*",
    "pydantic-settings==2.16.*",
    "pyjwt==2.15.*",
    "python-multipart==0.0.33",
    "sqlalchemy[asyncio]==2.1.*",
    "jinja2==3.1.*",
    "docxtpl==0.20.*",
    "taskiq==0.13.*",
    "tokenizers==0.23.*",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "granian[reload]==2.8.*",
    "taskiq[reload]==0.13.*",
    "ty==0.0.99",
]

test = [
    "pytest==9.2.*",
    "pytest-asyncio==1.4.*",
    "pytest-cov==7.1.*",
    "testcontainers[postgres]==4.15.*",
]

[tool.uv]
default-groups = ["dev", "test"]

[[tool.ty.overrides]]
include = ["src/core_service/framework/dependencies/**", "src/core_service/framework/workers/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-return-type = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
missing-argument = "ignore"
unknown-argument = "ignore"
pydantic-discarded-extra-argument = "ignore"
