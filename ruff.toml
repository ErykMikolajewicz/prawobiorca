line-length = 120
target-version = "py314"

exclude = [
    "core-service/alembic",
]

# Roots used to tell first-party imports (src.*, tests.*, manifests) from third-party ones.
src = ["core-service", "extraction-service", "scripts/local"]

[lint]
select = [
    "S", "I", "E", "F", "B", "UP", "ASYNC", "DTZ", "FAST", "LOG", "RUF", "C4", "PT",
    "SIM", "PIE", "G", "TID", "C90", "RET", "PERF", "PTH", "BLE", "PLW1510",
]
ignore = ["B904", "B008", "RET504"]

[lint.per-file-ignores]
"**/tests/**" = ["S"]
"**/scripts/**" = ["S", "ASYNC"]